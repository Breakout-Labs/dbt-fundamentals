version: 2

models:
  - name: demo_model_orders
    description: "Customer orders with quantities, amounts, and returns"
    columns:

      - name: order_id
        data_tests:
          - unique
          - not_null

      - name: quantity
        description: "Items ordered — must be at least 1, capped at 100"
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 100
                inclusive: true

      - name: order_amount
        description: "Total order value — must be positive"
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: false

      - name: discount_pct
        description: "Discount percentage — between 0 and 100"
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
                inclusive: true

      - name: quantity_returned
        description: "Returned items can't exceed quantity ordered"
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true

    data_tests:
      - dbt_utils.expression_is_true:
          arguments: 
            expression: "quantity_returned <= quantity"
            name: returned_quantity_within_ordered