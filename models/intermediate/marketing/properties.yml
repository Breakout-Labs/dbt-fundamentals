models:
  - name: int_marketing__customer_order_stats
    description: Description
    columns:
    - name: customer_id
      description: A unique identifier for each customer.
      data_tests:
        - not_null
        - unique
    - name: total_orders
      description: The total number of orders placed by the customer.
    - name: orders_delivered
      description: The number of orders that have been delivered to the customer.
    - name: avg_order_amount
      description: The average amount spent per order by the customer, rounded to two
        decimal places.