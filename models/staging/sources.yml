version: 2

sources:
  - name: ecomm
    database: raw
    tables:
      - name: deliveries
      - name: customers
        description: Customer data from our ecommerce application
        columns:
          - name: id
            description: '{{ doc("customer_id") }}'
            tests:
              - unique
              - not_null
              
      - name: orders
        identifier: orders_us
        columns:
          - name: order_id
            tests:
              - unique
              - not_null
            
  - name: sheets
    database: raw
    tables:
      - name: customer_survey_responses
