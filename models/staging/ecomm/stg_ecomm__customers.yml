models:
- name: stg_ecomm__customers
  description: This model serves as a staging layer for customer data from the e-commerce
    platform. It renames the primary key to 'customer_id' for consistency and prepares
    the data for downstream processing.
  columns:
  - name: customer_id
    description: A unique identifier for each customer, renamed from 'id' for consistency.
    tests:
      - unique
      - not_null
  - name: id
    description: The original unique identifier for each customer from the source
      data.
  - name: first_name
    description: The first name of the customer.
  - name: last_name
    description: The last name of the customer.
  - name: email
    description: The email address of the customer.
  - name: address
    description: The physical address of the customer.
  - name: phone_number
    description: The contact phone number of the customer.
  - name: created_at
    description: The timestamp when the customer record was created, in UTC.
